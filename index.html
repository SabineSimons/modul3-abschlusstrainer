*{box-sizing:border-box} html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #78aeff;outline-offset:2px}

main{max-width:1150px;margin:20px auto 65px;padding:0 15px} .card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:clamp(18px,3vw,29px);box-shadow:var(--shadow);margin-bottom:17px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(26px,4.5vw,43px);line-height:1.15;margin-bottom:11px}h2{font-size:22px;margin-bottom:12px}h3{font-size:18px;margin-bottom:7px}p{margin-bottom:12px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:var(--blue)}.muted{color:var(--muted)}.small{font-size:13px}.note{padding:13px 15px;border-radius:12px;background:#f1f5fb;border:1px solid #dce6f4}.warning{background:var(--yellow);border-color:#f1dfb6}.good{background:var(--goodbg);border-color:#a7dec2}.bad{background:var(--badbg);border-color:#efb7b7}.pill{display:inline-block;font-size:12px;padding:4px 10px;font-weight:800;border-radius:30px;background:#eaf0f8;color:#304967;margin:2px 3px 2px 0}.pills{display:flex;flex-wrap:wrap;gap:3px} .cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.pult{border-radius:15px;border:2px solid var(--line);padding:17px;display:flex;flex-direction:column;gap:6px;background:#fff}.pult.selected{border-color:var(--blue);background:#f0f6ff}.pult .big{font-size:29px;font-weight:900;line-height:1.1}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.module h3{margin:0}.module .stat{font-size:13px;color:var(--muted);margin:8px 0}.module .progress{height:9px;border-radius:10px;background:#e8eef6;overflow:hidden;margin:12px 0}.bar{background:var(--blue);height:100%;transition:width .2s}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.btn{border:0;background:#eaf0f8;color:#263f61;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px}.btn.primary{background:var(--blue);color:#fff}.btn.positive{background:var(--good);color:white}.btn.danger{color:var(--bad);background:#fff0f0;border:1px solid #edc9c9}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.48;cursor:not-allowed}.btn.smol{font-size:12px;padding:7px 10px}.sep{height:1px;background:var(--line);margin:19px 0}.chipline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.status{font-weight:800;color:var(--muted);font-size:13px}.status.ok{color:var(--good)}.timertag{background:#fff4dd;padding:7px 11px;border-radius:9px;color:#7b5100;font-weight:850;font-variant-numeric:tabular-nums}.question{font-size:clamp(19px,2.6vw,25px);font-weight:750;line-height:1.42;margin:16px 0 19px}.answers{display:grid;gap:9px}.answer{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;background:#fff;border:1.5px solid #d0dceb;border-radius:12px;cursor:pointer}.answer:hover{border-color:#8fb7f0;background:#f7faff}.answer.checked{border-color:var(--blue);background:#eaf2ff}.answer.correct{border-color:#76c19b;background:var(--goodbg)}.answer.incorrect{border-color:#e39a9a;background:var(--badbg)}.answer input{accent-color:var(--blue);width:18px;height:18px;margin-top:4px;flex-shrink:0}.answer .letter{min-width:23px;font-weight:900;color:#465b77}.answer .labeltxt{flex:1}.feedback{margin-top:15px;padding:16px;border-radius:12px;border:1px solid var(--line);background:#f7f9fd}.feedback.good{border-color:#a7dec2;background:var(--goodbg)}.feedback.bad{border-color:#efb7b7;background:var(--badbg)}.feedback strong{display:block;margin-bottom:5px}.gridchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}.gridchips button{border:1px solid var(--line);background:#f5f8fd;color:var(--ink);border-radius:7px;font-size:13px;padding:8px 5px}.gridchips button.done{background:#dcefe4;border-color:#8ccbaa}.gridchips button.flag{border:2px solid #e9ba55}.gridchips button.active{outline:3px solid #81aff0}.rightalign{margin-left:auto}.hidden{display:none!important}.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.formrow label{font-weight:700}.formrow select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:white;min-width:115px}.listitems{display:grid;gap:9px}.listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:11px}.modalback{position:fixed;inset:0;background:#16263a9c;display:flex;align-items:center;justify-content:center;z-index:30;padding:15px}.modal{background:white;border-radius:18px;padding:22px;max-width:460px;width:100%;box-shadow:0 12px 44px #11203030}.review{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:12px}.review h4{margin:0 0 6px}.review .tag{font-size:12px;color:var(--muted)}.footer{font-size:13px;color:var(--muted);text-align:center;padding:15px}

<script>
const BANK=[{"id":"E01-Q01","module":1,"number":1,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Zuordnung von Adressierungsinformation und OSI-Schicht ist korrekt?","choices":["MAC-Adresse: Schicht 4; IP-Adresse: Schicht 3; Portnummer: Schicht 2","MAC-Adresse: Schicht 3; IP-Adresse: Schicht 2; Portnummer: Schicht 4","MAC-Adresse: Schicht 2; IP-Adresse: Schicht 4; Portnummer: Schicht 3","MAC-Adresse: Schicht 2; IP-Adresse: Schicht 3; Portnummer: Schicht 4"],"correct":[3],"explanation":"MAC-Adressen gehören zur Sicherungsschicht (Layer 2), IP-Adressen zur Vermittlungsschicht (Layer 3) und TCP-/UDP-Portnummern zur Transportschicht (Layer 4).","variant":"Bei welcher OSI-Schicht liegen MAC-Adressen, IP-Adressen und TCP/UDP-Portnummern jeweils?"},{"id":"E01-Q02","module":1,"number":2,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welcher Punkt ist ein typischer Nachteil des Client-Server-Modells?","choices":["Zugriffsrechte müssen grundsätzlich auf jedem Client einzeln gepflegt werden.","Die Datenhaltung kann nicht zentral organisiert werden.","Der zentrale Server kann als Single Point of Failure alle davon abhängigen Dienste beeinträchtigen.","Neue Clients lassen sich nur durch Austausch des Servers hinzufügen."],"correct":[2],"explanation":"Bei Client-Server hängen viele Teilnehmer von einem zentralen Server ab. Fällt er ohne Ersatz aus, sind die dort bereitgestellten Dienste für alle betroffen.","variant":"Welche Schwachstelle kann durch die zentrale Abhängigkeit im Client-Server-Betrieb entstehen?"},{"id":"E01-Q03","module":1,"number":3,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Folge ist typisch für einen Duplex-Mismatch, wenn eine Seite Half-Duplex und die andere Full-Duplex nutzt?","choices":["Eine dauerhaft abgeschaltete Senderichtung","Niedrigere Latenz bei unveränderter Fehlerrate","Hohe Fehlerraten und niedriger Durchsatz","Automatische Umwandlung des Switches in einen Hub"],"correct":[2],"explanation":"Half-Duplex kann nicht gleichzeitig senden und empfangen; Full-Duplex schon. Bei falscher Kombination entstehen unter anderem Kollisionen, Fehler und schlechte Leistung.","variant":"Welche Probleme entstehen typischerweise, wenn Half- und Full-Duplex an einem Ethernet-Link unterschiedlich eingestellt sind?"},{"id":"E01-Q04","module":1,"number":4,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Ein Notebook sendet einen Druckauftrag über einen Switch an einen Netzwerkdrucker. Welche Einordnung ist korrekt?","choices":["Notebook und Drucker sind Endsysteme; der Switch ist ein Zwischensystem.","Nur das Notebook ist ein Endsystem; Switch und Drucker sind Zwischensysteme.","Notebook ist ein Zwischensystem; Switch und Drucker sind Endsysteme.","Notebook und Switch sind Endsysteme; der Drucker ist ein Zwischensystem."],"correct":[0],"explanation":"Das Notebook erstellt die Daten, der Drucker empfängt sie. Beide sind Endgeräte. Der Switch vermittelt die Verbindung dazwischen.","variant":"Welche Rolle spielen Notebook, Netzwerkdrucker und Switch beim Versenden eines Druckauftrags?"},{"id":"E01-Q05","module":1,"number":5,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Mehrere PCs sind jeweils mit einem eigenen Kabel an einen Hub angeschlossen. Wie lässt sich dieses Netz einordnen?","choices":["Physisch als Bus, logisch als Stern mit zentraler, adressbasierter Weiterleitung","Physisch als vermaschtes Netz, logisch als gemeinsam genutztes Bus-Medium","Physisch als Stern, logisch als gemeinsames beziehungsweise busartiges Medium","Physisch als Stern, logisch als Sammlung direkter Punkt-zu-Punkt-Verbindungen"],"correct":[2],"explanation":"Ein Hub ist physisch der Mittelpunkt der sternförmigen Verkabelung. Logisch teilen sich jedoch alle PCs dasselbe Übertragungsmedium wie beim Bus.","variant":"Ein Hub steht zentral und PCs hängen sternförmig daran. Wie sehen die physische und die logische Topologie aus?"},{"id":"E01-Q06","module":1,"number":6,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Warum haben Switches Hubs in modernen Ethernet-Netzen weitgehend ersetzt?","choices":["Ein Hub kann nur Glasfaser verarbeiten, während ein Switch sowohl Kupferverbindungen als auch Funkstrecken direkt bedient.","Ein Switch verbindet grundsätzlich verschiedene IP-Netzwerke, während ein Hub ausschließlich Teilnehmer desselben LANs koppelt.","Ein Switch wiederholt alle Signale wie ein Hub, kann dies aber durch eine höhere interne Taktfrequenz schneller ausführen.","Hubs teilen eine Kollisionsdomäne und senden an alle Ports; Switches leiten Frames per MAC-Adresse gezielt weiter."],"correct":[3],"explanation":"Beim Hub teilen sich alle Ports dieselbe Kollisionsdomäne. Ein Switch lernt MAC-Adressen und schickt Frames im Normalfall nur zum passenden Port.","variant":"Weshalb ist ein Switch für moderne Ethernet-LANs meist günstiger als ein klassischer Hub?"},{"id":"E01-Q07","module":1,"number":7,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welcher Nachteil ist typisch für Hub-and-Spoke, wenn zwei Außenstellen häufig direkt miteinander kommunizieren möchten?","choices":["Jede Außenstelle benötigt für die Kommunikation mit einer anderen Außenstelle zusätzlich eine eigene direkte WAN-Leitung.","Hub-and-Spoke benötigt bei gleicher Standortzahl grundsätzlich mehr WAN-Leitungen als eine vollständige Vermaschung.","Der Verkehr zwischen Spokes nimmt den Umweg über den Hub, der dadurch zum Engpass werden kann.","Zentrale Sicherheitsrichtlinien lassen sich am Hub nicht umsetzen."],"correct":[2],"explanation":"In Hub-and-Spoke verlaufen Verbindungen zwischen Außenstellen über die Zentrale. Das verlängert den Weg und kann den zentralen Hub auslasten.","variant":"Welche unerwünschte Eigenschaft hat eine Hub-and-Spoke-Verbindung bei hohem Datenverkehr zwischen Außenstellen?"},{"id":"E01-Q08","module":1,"number":8,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Zwei Standorte sind über eine gemietete Verbindung gekoppelt, die im Provider-Netz über mehrere Zwischenstationen läuft. Warum kann sie trotzdem logisch als Punkt-zu-Punkt gelten?","choices":["Als Punkt-zu-Punkt gilt nur eine einzelne physische Kabelstrecke ohne Router, Switches oder andere Zwischenstationen.","Entscheidend ist die logische 1:1-Beziehung der Endpunkte, nicht die Zahl der physischen Zwischenstationen.","Sobald Provider-Router beteiligt sind, wird eine Verbindung unabhängig von den Endpunkten als Hub-and-Spoke eingeordnet.","Eine Punkt-zu-Punkt-Verbindung ist nur möglich, wenn beide Endpunkte zum selben lokalen IP-Netz gehören."],"correct":[1],"explanation":"Punkt-zu-Punkt bezeichnet die logische Verbindung genau zweier Endpunkte. Das Providernetz kann dazwischen mehrere Geräte verwenden.","variant":"Wann ist eine Standortverbindung logisch Punkt-zu-Punkt, selbst wenn im Providernetz mehrere Geräte beteiligt sind?"},{"id":"E01-Q09","module":1,"number":9,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Was unterscheidet einen Standard-Media-Converter von einem Switched-Media-Converter?","choices":["Beide arbeiten auf Schicht 1; nur der verwendete Steckertyp unterscheidet sie.","Standard: Schicht 1 ohne Pufferung; Switched: Schicht 2 mit Frame-Pufferung und unterschiedlichen Datenraten.","Der Switched-Converter routet zwischen zwei IP-Netzen und kann deshalb verschiedene Medien koppeln; der Standard-Converter führt nur NAT aus.","Der Standard-Converter arbeitet auf Schicht 2, puffert Frames und kann dadurch unterschiedliche Datenraten koppeln; der Switched-Converter arbeitet nur auf Bitebene."],"correct":[1],"explanation":"Ein einfacher Medienkonverter setzt hauptsächlich Signale um. Ein Switched-Medienkonverter kann Ethernet-Frames zwischenspeichern und verschiedene Link-Geschwindigkeiten koppeln.","variant":"Wie unterscheidet sich die Arbeitsweise eines einfachen Medienkonverters von einem Switched-Konverter?"},{"id":"E01-Q10","module":1,"number":10,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Kombination beschreibt nach dem Kursmaterial grundsätzlich ein Netzwerk?","choices":["Mehrere Endgeräte, die über einen Router im selben Standort gemeinsam auf das Internet zugreifen.","Mindestens zwei über ein Medium verbundene Systeme, die ein gemeinsames Protokoll nutzen.","Mindestens zwei Geräte mit gleicher IP-Adresse, die über einen zentralen Switch miteinander verbunden sind.","Zwei Systeme mit direkter Kabelverbindung, identischer Netzwerkkarte und gleicher Übertragungsgeschwindigkeit."],"correct":[1],"explanation":"Ein Netzwerk besteht bereits, wenn mindestens zwei Systeme über ein Medium mit passenden gemeinsamen Kommunikationsregeln Daten austauschen können.","variant":"Welche minimale Voraussetzung beschreibt ein Netzwerk aus miteinander kommunizierenden Systemen?"},{"id":"E01-Q11","module":1,"number":11,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Aussage trifft den Unterschied zwischen OSI- und TCP/IP-Modell am besten?","choices":["OSI ist vor allem Referenz- und Analysemodell; TCP/IP ist an die praktisch eingesetzte Protokollsuite gebunden.","OSI beschreibt nur physische Netzwerke; TCP/IP nur Anwendungen.","OSI legt konkrete Ethernet-Stecker und Bitkodierungen fest; TCP/IP wird hauptsächlich als abstraktes Lehrmodell genutzt.","Beide Modelle besitzen dieselben Funktionsschichten und unterscheiden sich im Wesentlichen nur durch ihre Bezeichnungen."],"correct":[0],"explanation":"Das OSI-Modell ist ein siebenschichtiges Denkmodell zur Einordnung und Fehlersuche. TCP/IP beschreibt die praktisch verwendete Internet-Protokollfamilie.","variant":"Was ist der wesentliche Unterschied zwischen dem OSI-Referenzmodell und TCP/IP im praktischen Netzbetrieb?"},{"id":"E01-Q12","module":1,"number":12,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"In welcher Reihenfolge entstehen beim Senden die PDU-Bezeichnungen von oben nach unten?","choices":["Daten → Segment → Frame → Paket → Bits","Daten → Frame → Paket → Segment → Bits","Daten → Segment → Paket → Frame → Bits","Daten → Paket → Segment → Frame → Bits"],"correct":[2],"explanation":"Von der Anwendung nach unten werden Daten zunächst als Segmente, dann als IP-Pakete und Ethernet-Frames behandelt und schließlich als Bits übertragen.","variant":"Ordne die Namen der Daten-Einheiten vom Anwendungsbereich bis zur Bitübertragung richtig."},{"id":"E01-Q13","module":1,"number":13,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Netzwerkfunktion hilft am direktesten dabei, einen Videoanruf bei hoher Netzauslastung zu bevorzugen?","choices":["Dynamic Host Configuration Protocol (DHCP)","Virtual Private Network (VPN)","Domain Name System (DNS)","Quality of Service (QoS)"],"correct":[3],"explanation":"QoS (Quality of Service) priorisiert zeitkritische Anwendungen wie Sprache und Video gegenüber weniger empfindlichem Datenverkehr.","variant":"Welcher Mechanismus sorgt dafür, dass ein Videoanruf bei hoher Netzauslastung Vorrang haben kann?"},{"id":"E01-Q14","module":1,"number":14,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Was macht ein Router typischerweise, wenn er ein IP-Paket zum nächsten Netzwerkabschnitt weiterleitet?","choices":["Er bestimmt den nächsten Netzwerkabschnitt anhand der Zielportnummer und behält dabei den vorhandenen Frame bei.","Er entfernt den aktuellen Frame, prüft die Ziel-IP und erstellt für den nächsten Abschnitt einen neuen Frame.","Er wiederholt den empfangenen Bitstrom an alle verfügbaren Ports, bis der Zielhost das Paket selbst erkennt.","Er leitet den empfangenen Ethernet-Frame unverändert anhand der Ziel-MAC-Adresse bis zum nächsten Router weiter."],"correct":[1],"explanation":"Ein Router prüft die Ziel-IP im Paket, bestimmt den nächsten Weg und verpackt das Paket für das nächste Netzwerksegment in einen passenden neuen Frame.","variant":"Wie bearbeitet ein Router einen ankommenden Frame und ein enthaltenes IP-Paket beim Weiterleiten?"},{"id":"E01-Q15","module":1,"number":15,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Ein Unternehmen mit mehreren Dutzend Mitarbeitenden an einem Standort nutzt strukturierte Verkabelung sowie mehrere Switches und Router. Welcher Netzwerktyp passt am besten?","choices":["Enterprise-LAN","Datacenter-Netzwerk","SOHO-Netzwerk","SME-Netzwerk"],"correct":[3],"explanation":"SME bedeutet kleines oder mittleres Unternehmen. Mehrere Dutzend Mitarbeitende mit professionellen Switches und Routern passen am besten dazu.","variant":"Welche Netzwerkgröße ist für einen Standort mit mehreren Dutzend Mitarbeitenden am passendsten?"},{"id":"E01-Q16","module":1,"number":16,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Zuordnung beschreibt die integrierten Funktionen eines SOHO-Routers korrekt?","choices":["Schicht 1: Ports und Funk; Schicht 2: Switch und Access Point; Schicht 3: Routing zwischen LAN und WAN.","Schicht 1 stellt DNS bereit; Schicht 2 übernimmt Routing; Schicht 3 wandelt digitale Signale über Transceiver um.","Schicht 1 übernimmt das Routing zwischen LAN und WAN; Schicht 2 stellt DHCP bereit; Schicht 3 steuert die Funkübertragung.","Schicht 1 setzt Firewall-Regeln um; Schicht 2 führt die Adressübersetzung durch; Schicht 3 arbeitet als Ethernet-Switch."],"correct":[0],"explanation":"Ein typischer SOHO-Router kombiniert elektrische/Funk-Schnittstellen (L1), Switching/WLAN (L2) und Routing zwischen IP-Netzen (L3).","variant":"Wie verteilen sich typische SOHO-Router-Funktionen auf die OSI-Schichten 1, 2 und 3?"},{"id":"E01-Q17","module":1,"number":17,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Wie unterscheiden sich Standard- und Extended-ACLs laut Kursmaterial?","choices":["Standard-ACLs filtern nach Ports; Extended-ACLs nur nach MAC-Adressen.","Beide Varianten können Quelle, Ziel, Protokoll und Port prüfen und unterscheiden sich lediglich in Nummerierung und maximaler Regellänge.","Standard-ACLs filtern nach Quelle; Extended-ACLs können zusätzlich Ziel, Protokoll und Port berücksichtigen.","Standard-ACLs prüfen Quelle und Ziel; Extended-ACLs beschränken sich dagegen ausschließlich auf die Quelladresse."],"correct":[2],"explanation":"Standard-ACLs unterscheiden vor allem die Quell-IP. Extended-ACLs erlauben zusätzlich Bedingungen für Ziel, Protokoll und Ports.","variant":"Welche Kriterien können Standard-ACLs im Vergleich zu Extended-ACLs bei Cisco prüfen?"},{"id":"E01-Q18","module":1,"number":18,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Für einen Dateidownload ist zuverlässige Übertragung wichtiger als minimale Verzögerung. Welche Wahl passt?","choices":["Ethernet, weil ein beschädigter Frame automatisch alle verlorenen Daten rekonstruiert.","UDP, weil es ohne Verbindungsaufbau und Bestätigungen arbeitet.","IP, weil es die vollständige Ende-zu-Ende-Zustellung garantiert.","TCP, weil verlorene Segmente erkannt und bei Bedarf erneut übertragen werden, um eine zuverlässige Zustellung zu ermöglichen."],"correct":[3],"explanation":"TCP verwendet Bestätigungen und erneute Übertragungen verlorener Segmente. Deshalb eignet es sich für zuverlässige Dateiübertragung.","variant":"Welches Verfahren passt zu Downloads, wenn eine fehlerfreie vollständige Übertragung im Vordergrund steht?"},{"id":"E01-Q19","module":1,"number":19,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Warum wird in größeren Netzen häufig eine Teilvermaschung statt einer Vollvermaschung eingesetzt?","choices":["Sie verzichtet auf alternative Routen und reduziert damit den Verwaltungsaufwand auf Kosten der Ausfallsicherheit.","Sie behält dieselbe physische Verkabelung wie eine Vollvermaschung bei, benötigt aber weniger logische IP-Adressen.","Sie verbindet jeden Knoten genau mit einem zentralen Hub und übernimmt damit die Grundstruktur einer Sterntopologie.","Sie verbindet nur wichtige Knotenpaare direkt und balanciert so Redundanz, Kosten und Komplexität."],"correct":[3],"explanation":"Bei einer Teilvermaschung werden nur wichtige Verbindungen direkt ausgeführt. Das spart Aufwand und bewahrt trotzdem sinnvolle Ausweichwege.","variant":"Warum wird eine Teilvermaschung eingesetzt, obwohl eine Vollvermaschung mehr direkte Wege bieten würde?"},{"id":"E01-Q20","module":1,"number":20,"source":"Frage 1.docx","topic":"Netzwerkgrundlagen & OSI","kind":"single","question":"Welche Aussage beschreibt einen typischen Trade-off einer virtualisierten Firewall-Appliance?","choices":["Sie kann keine Firewall-Funktion übernehmen, weil virtuelle Appliances nur auf Schicht 2 arbeiten.","Sie benötigt für jede Instanz ein eigenes physisches Netzwerkgerät, ist dafür unabhängig vom Hypervisor.","Sie ist flexibel und leicht migrierbar, hängt aber sicherheitstechnisch auch vom Hypervisor ab.","Sie besitzt immer dedizierte Hardware-Ressourcen und bietet dadurch grundsätzlich besser vorhersagbare Leistung."],"correct":[2],"explanation":"Eine virtuelle Firewall lässt sich flexibel betreiben oder verschieben. Ihre Sicherheit hängt aber auch vom Hypervisor und der darunterliegenden Infrastruktur ab.","variant":"Was gewinnt und riskiert man beim Einsatz einer Firewall als virtuelle Appliance?"},{"id":"E02-Q01","module":2,"number":1,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Welche niedrigste Kabelkategorie ist für 10GBASE-T über eine Strecke von 90 Metern erforderlich?","choices":["Cat 7","Cat 5e","Cat 6A","Cat 6"],"correct":[2],"explanation":"10GBASE-T über 90 Meter benötigt mindestens Cat 6A für eine normgerechte, bis 100 Meter vorgesehene Verbindung.","variant":"Ein 10-Gigabit-Ethernet-Kabel soll 90 Meter überbrücken. Welche kleinste Kategorie ist dafür passend?"},{"id":"E02-Q02","module":2,"number":2,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche Aussagen zur statischen und dynamischen IPv4-Adressvergabe treffen zu?","choices":["Router, Switches und Access Points werden typischerweise statisch adressiert.","Eine per DHCP bezogene Adresse dient als feste, dauerhaft unveränderte Gerätekennung.","Ein DHCP-Server kann zusammen mit einer IP-Adresse auch Subnetzmaske, Standardgateway und DNS-Server mitteilen.","Ein DHCP-Client sendet zu Beginn eine Discover-Nachricht als Broadcast.","Bei einer statischen Konfiguration genügt die IP-Adresse ohne Subnetzmaske, Gateway und DNS-Server."],"correct":[0,2,3],"explanation":"Netzgeräte erhalten oft feste Management-Adressen. DHCP kann neben der IP auch Gateway, DNS und Maske verteilen; zu Beginn läuft DHCP Discover per Broadcast.","variant":"Welche Aussagen zu festen IP-Adressen und den durch DHCP verteilten IPv4-Konfigurationsdaten stimmen?"},{"id":"E02-Q03","module":2,"number":3,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Ein Handscanner erhält die Adresse 169.254.12.34. Worauf weist diese Adresse in der Regel hin?","choices":["Die DHCP-basierte Adressvergabe ist fehlgeschlagen.","Der Scanner hat eine öffentliche Internetadresse erhalten.","Der Scanner wurde statisch im privaten 192.168.0.0/16-Bereich konfiguriert.","Der Scanner ist einer Multicast-Gruppe beigetreten."],"correct":[0],"explanation":"169.254.x.x gehört zu APIPA. Diese Adresse wählt ein Gerät typischerweise selbst, wenn es keine brauchbare IPv4-Adresse per DHCP bekommt.","variant":"Ein Client bekommt 169.254.12.34. Was lässt sich daraus über seine IPv4-Adressvergabe schließen?"},{"id":"E02-Q04","module":2,"number":4,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Wofür steht die Endung „SR“ in der Ethernet-Bezeichnung 10GBASE-SR?","choices":["Twisted Pair über Kupferkabel","Kurze Verbindung über Twinax","Long Reach über Singlemode-Glasfaser","Short Range über Multimode-Glasfaser"],"correct":[3],"explanation":"SR bedeutet Short Range: 10GBASE-SR ist eine Glasfaser-Variante für kürzere Strecken mit Multimode-Fasern.","variant":"Welche Faserart und Reichweite beschreibt die Bezeichnung 10GBASE-SR?"},{"id":"E02-Q05","module":2,"number":5,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Wie reagiert eine WLAN-Station bei CSMA/CA, wenn nach dem Senden eines Frames kein ACK eintrifft?","choices":["Sie schaltet den Access Point dauerhaft ab.","Sie wechselt automatisch in den Ad-hoc-Modus.","Sie versucht die Übertragung nach einer Wartezeit erneut.","Sie sendet sofort ein Jam-Signal."],"correct":[2],"explanation":"Ohne ACK weiß die WLAN-Station nicht, ob der Frame angekommen ist. Nach einer Wartezeit versucht sie es erneut.","variant":"Ein WLAN-Client erhält nach der Frame-Übertragung keine Bestätigung. Was macht CSMA/CA normalerweise?"},{"id":"E02-Q06","module":2,"number":6,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche Aussagen zu den WLAN-Frequenzbändern 2,4 GHz und 5 GHz treffen zu?","choices":["Die Kanäle 1, 6 und 11 sind im 2,4-GHz-Band die praktische Grundlage für eine nicht überlappende Planung.","5 GHz bietet mehr Kanäle und höhere Datenraten auf kurze Distanz.","5 GHz erreicht durch massive Möbel und Wände eine größere Reichweite als 2,4 GHz.","2,4 GHz durchdringt Wände und Decken bei gleicher Sendeleistung besser als 5 GHz.","Channel Bonding ist in Mehr-AP-Netzen besonders im 2,4-GHz-Band empfehlenswert."],"correct":[0,1,3],"explanation":"Bei 2,4 GHz nutzt man meist die überlappungsarmen Kanäle 1, 6 und 11. 5 GHz bietet mehr Kanäle und oft höhere Datenraten, hat aber meist geringere Reichweite durch Hindernisse.","variant":"Welche Aussagen zu Kanalplanung, Reichweite und Datenrate der Bänder 2,4 und 5 GHz sind richtig?"},{"id":"E02-Q07","module":2,"number":7,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Für die 150 Meter lange, erdverlegte Backbone-Strecke zwischen Bürogebäude und Lagerhalle ist eine zukunftssichere Verbindung geplant. Welches Übertragungsmedium entspricht dieser Planung?","choices":["OS2-Singlemode-Glasfaser","Cat-6A-UTP-Kupferkabel","Passives Twinax-DAC-Kabel","OM1-Multimode-Glasfaser"],"correct":[0],"explanation":"Für eine Gebäude-zu-Gebäude-Strecke ist OS2-Singlemode-Glasfaser robust und zukunftssicher; 150 Meter überschreiten die übliche 100-Meter-Grenze von Twisted Pair.","variant":"Welches Medium ist für eine 150 Meter lange, zukunftssichere Verbindung zwischen zwei Gebäuden sinnvoll?"},{"id":"E02-Q08","module":2,"number":8,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche Aussagen zu Glasfasersteckern und Farbcodes treffen zu?","choices":["Ein gelbes Singlemode-Kabel mit blauem Stecker steht für UPC-Politur.","Ein grüner APC-Stecker darf nicht mit einem blauen UPC-Stecker verbunden werden.","LC ist ein historischer Bajonett-Stecker für ältere Multimode-Installationen.","Ein MPO-Stecker bündelt immer genau zwei Fasern.","OM3-Glasfaser ist an einem orangefarbenen Mantel mit beigefarbenem Stecker erkennbar."],"correct":[0,1],"explanation":"Singlemode-Fasern haben typischerweise einen gelben Mantel. Blau kennzeichnet häufig UPC, Grün APC; APC und UPC darf man nicht direkt zusammenstecken.","variant":"Bei Glasfaser ist zwischen blauem UPC und grünem APC zu unterscheiden. Welche Aussagen dazu stimmen?"},{"id":"E02-Q09","module":2,"number":9,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Welche Antennenlösung hilft bei einer sehr hohen Hallendecke gegen ein schwächeres Signal direkt unter einem omnidirektionalen Access Point?","choices":["Eine ausschließlich horizontal abstrahlende Antenne","Eine Yagi-Antenne mit engem Bündelungswinkel","Eine Downtilt-Antenne","Ein Access Point für Tischmontage"],"correct":[2],"explanation":"Eine nach unten geneigte Antenne lenkt mehr Funkenergie in den Bereich unterhalb der Montagehöhe und reduziert Versorgungslücken.","variant":"Wie lässt sich die WLAN-Ausleuchtung direkt unter einem sehr hoch montierten AP verbessern?"},{"id":"E02-Q10","module":2,"number":10,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Welche zentrale Aufgabe übernimmt das Internet Protocol auf OSI-Schicht 3?","choices":["Es stellt Ethernet-Frames innerhalb eines Segments per MAC-Adresse zu.","Es adressiert Schnittstellen logisch und leitet Pakete zwischen Netzwerken weiter.","Es weist WLAN-Clients einen Funkkanal zu.","Es überträgt elektrische Signale über Kupferadern."],"correct":[1],"explanation":"IP-Adressen kennzeichnen logische Schnittstellen. Router nutzen das IP-Protokoll, um Pakete zwischen unterschiedlichen Netzen zu transportieren.","variant":"Welche Aufgabe übernimmt IP im Zusammenspiel von Adressierung und Routing?"},{"id":"E02-Q11","module":2,"number":11,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche der folgenden Aussagen zur Zuordnung von Steckverbinder und Einsatzbereich treffen zu?","choices":["Ein BNC-Stecker ist der Standard für feste Kabelmodem-Anschlüsse.","Ein LC-Stecker ist der Standardanschluss für Twisted-Pair-Kupferkabel.","Ein F-Stecker ist der Standard für feste CATV- und Kabelmodem-Anschlüsse.","Ein RJ45-Stecker wird für analoge Telefonanschlüsse verwendet.","Ein TERA-Stecker ist für CATV-Anschlüsse vorgesehen."],"correct":[2],"explanation":"F-Stecker werden typischerweise bei Koaxialanschlüssen für Kabelfernsehen und Kabelmodems verwendet.","variant":"Welche der genannten Steckverbinder passt tatsächlich zum vorgesehenen Kabel- beziehungsweise Geräteeinsatz?"},{"id":"E02-Q12","module":2,"number":12,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Welche Prüfung ist vor der Bestellung eines passiven DAC-Kabels für zwei benachbarte Switches besonders wichtig?","choices":["Ob die Kupferstrecke eine Länge von 100 Metern erreicht","Ob das Patchpanel nach T568B terminiert wurde","Ob der Switch-Hersteller das passive DAC-Kabel freigegeben hat","Ob die Glasfaserpolarität zwischen Tx und Rx vertauscht ist"],"correct":[2],"explanation":"Passive DAC-Verbindungen sind kurz, preiswert und hersteller-/modulabhängig. Vor dem Kauf prüfen, ob die Geräte das konkrete Kabel unterstützen.","variant":"Was muss vor der Anschaffung eines passiven DAC-Kabels zwischen zwei Switches abgeklärt werden?"},{"id":"E02-Q13","module":2,"number":13,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Welche Leiterbauform ist für ein flexibles Patchkabel zwischen Patchpanel und Switch vorgesehen?","choices":["Litzenleiter","Stahldrahtleiter","Massivleiter","Glasfaserleiter"],"correct":[0],"explanation":"Ein Patchkabel ist beweglich und nutzt flexible Litzen. Starre Massivleiter werden meist für fest verlegte Installationskabel verwendet.","variant":"Was für Leiter verwendet man in einem biegsamen Ethernet-Patchkabel?"},{"id":"E02-Q14","module":2,"number":14,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche der folgenden IPv4-Adressen gehört zu einem privaten RFC-1918-Adressbereich?","choices":["11.20.5.30","172.20.5.30","172.32.5.30","192.167.5.30","172.15.5.30"],"correct":[1],"explanation":"Private IPv4-Bereiche sind 10.0.0.0/8, 172.16.0.0 bis 172.31.255.255 und 192.168.0.0/16. 172.20.5.30 liegt darin.","variant":"Welche IPv4-Adresse liegt innerhalb der privaten Adressblöcke nach RFC 1918?"},{"id":"E02-Q15","module":2,"number":15,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche Aussagen zu Werkzeugen für Kabeltests und Fehlersuche treffen zu?","choices":["Ein hoher Einfügeverlust bedeutet eine besonders gute Kupferverbindung.","Ein Tongenerator mit Sonde zertifiziert eine Strecke formal als Cat 6A.","Ein Visual Fault Locator kann Faserbrüche, starke Biegungen oder fehlerhafte Spleiße als hellen Punkt sichtbar machen.","Ein einfacher Wire-Map-Tester erkennt ein Split Pair zuverlässig.","Ein Wire-Map-Tester kann eine Unterbrechung oder einen Kurzschluss erkennen."],"correct":[2,4],"explanation":"Ein Visual Fault Locator macht starke Lichtaustritte an Glasfaserfehlerstellen sichtbar. Ein einfacher Wire-Map-Tester erkennt Verkabelungsfehler wie Kurzschluss oder Unterbrechung.","variant":"Welche Aussagen über Wire-Map-Tester und Werkzeuge zur Glasfaser-Fehlersuche sind richtig?"},{"id":"E02-Q16","module":2,"number":16,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"single","question":"Was muss bei einer geschirmten S/FTP-Kupferstrecke in einer störungsintensiven Lagerhalle unbedingt beachtet werden?","choices":["Die Schirmung ist unabhängig von der Terminierung immer wirksam.","Die Adernpaare müssen vor dem IDC-Anschluss möglichst weit aufgedrillt werden.","Der Schirm muss über Steckverbinder und Patchpanel korrekt gebondet und geerdet sein.","Es genügt, die Schirmung nur auf einer Seite anzuschließen."],"correct":[2],"explanation":"Die Schirmung muss fachgerecht durchverbunden und in das Erdungs-/Potentialausgleichskonzept eingebunden sein, sonst schützt sie nicht zuverlässig.","variant":"Was ist bei der Erdung und durchgängigen Schirmung einer S/FTP-Strecke wichtig?"},{"id":"E02-Q17","module":2,"number":17,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche Aussagen zur strukturierten Verkabelung treffen zu?","choices":["Ein Endgerät wird im Arbeitsbereich über ein flexibles Patchkabel mit der RJ45-Wanddose verbunden.","Ein Telekommunikationsraum mit IDF, Patchpanel und Switch sollte abschließbar und klimatisiert sein.","Die feste horizontale Kupferverkabelung von der Wanddose zum IDF darf höchstens 90 Meter lang sein.","Die Backbone-Verkabelung verbindet IDFs mit dem MDF.","Ein Telekommunikationsraum ist als allgemeiner Abstellraum vorgesehen."],"correct":[0,1,2,3],"explanation":"Patchkabel verbinden Geräte mit Dosen, die feste Kupferstrecke hat gewöhnlich maximal 90 Meter. MDF und IDF verbinden die Verteiler über den Backbone.","variant":"Welche Regeln gelten für die Verbindung von Arbeitsplatz, Netzwerkdose, IDF, MDF und Backbone?"},{"id":"E02-Q18","module":2,"number":18,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"multi","question":"Welche Aussagen zu Wi-Fi 6 treffen zu?","choices":["Verbesserte Modulation und Signalcodierung erhöhen die übertragene Datenmenge pro Paket um rund 40 Prozent.","Wi-Fi 6 erweitert MU-MIMO auf bis zu acht gleichzeitig bedienbare Stationen.","Wi-Fi 6 arbeitet ausschließlich im 5-GHz-Band.","OFDMA teilt einen Kanal in Resource Units auf, die mehreren Stationen parallel zugewiesen werden können.","Wi-Fi 6 kann durch Resource Units mit gemischten Geräteflotten effizienter umgehen als klassische Mixed-Modi."],"correct":[0,1,3,4],"explanation":"Wi-Fi 6 verbessert die Effizienz durch OFDMA/Resource Units, höherwertige Modulation und MU-MIMO. So können mehrere Clients besser gleichzeitig bedient werden.","variant":"Welche Merkmale von Wi-Fi 6 wie OFDMA, MU-MIMO und bessere Modulation sind korrekt beschrieben?"},{"id":"E02-Q19","module":2,"number":19,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"tf","question":"Ein DHCP-Discover-Broadcast aus der Lagerhalle erreicht ohne weitere Maßnahmen über einen Router auch ein anderes Netzwerk im Bürogebäude.","choices":["Wahr","Falsch"],"correct":[1],"explanation":"Falsch: Router leiten IPv4-Broadcasts nicht einfach ins nächste Subnetz weiter. Dafür nutzt man bei DHCP beispielsweise einen DHCP-Relay-Agent.","variant":"Ein DHCP-Discover-Broadcast geht ohne besondere Konfiguration vom einen Netz über einen Router ins andere. Wahr oder falsch?"},{"id":"E02-Q20","module":2,"number":20,"source":"Frage 11.docx","topic":"Verkabelung, WLAN & Adressen","kind":"tf","question":"NAT kann am Router private Quelladressen interner Geräte durch eine öffentliche Adresse ersetzen und Antworten mithilfe einer Übersetzungstabelle wieder den internen Geräten zuordnen.","choices":["Wahr","Falsch"],"correct":[0],"explanation":"Wahr: NAT übersetzt Adressen; die Verbindungstabelle hilft, eingehende Antwortpakete dem richtigen internen Gerät zuzuordnen.","variant":"Ein Router kann per NAT private Quelladressen für Internetzugriffe übersetzen und Antworten dem internen Gerät zuordnen. Wahr oder falsch?"},{"id":"E03-Q01","module":3,"number":1,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welche Auswirkung hat Subnetting auf ARP-Broadcasts?","choices":["Sie werden beim Router in Unicast-Pakete umgewandelt.","Sie werden automatisch in alle anderen Subnetze weitergeleitet.","Sie bleiben auf die jeweilige Broadcast-Domäne begrenzt.","Sie erreichen innerhalb des Subnetzes nur das Default Gateway."],"correct":[2],"explanation":"ARP-Broadcasts bleiben in ihrer Broadcast-Domäne. Router leiten sie normalerweise nicht in andere Subnetze weiter.","variant":"Wie weit reichen ARP-Broadcasts, wenn ein Netzwerk in mehrere IP-Subnetze geteilt wurde?"},{"id":"E03-Q02","module":3,"number":2,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welche Dezimalschreibweise entspricht der Präfixlänge /20?","choices":["255.255.0.0","255.255.240.0","255.255.248.0","255.255.224.0"],"correct":[1],"explanation":"Bei /20 sind 20 Bits auf 1 gesetzt: 255.255.240.0. Das dritte Oktett beginnt mit 11110000, also 240.","variant":"Welche Subnetzmaske in Dezimalschreibweise gehört zur IPv4-Präfixlänge /20?"},{"id":"E03-Q03","module":3,"number":3,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Was macht ein Host, wenn das Ziel nicht im eigenen Subnetz liegt und ein korrektes Default Gateway konfiguriert ist?","choices":["Er sendet das Paket an das Default Gateway.","Er ändert seine eigene IP-Adresse in eine Adresse des Zielnetzes.","Er verwirft das Paket grundsätzlich ohne weiteren Versuch.","Er versucht, die MAC-Adresse des entfernten Zielhosts direkt per ARP zu ermitteln."],"correct":[0],"explanation":"Ein Host sendet Pakete für fremde Netze an sein Standardgateway, das sie weiterleitet.","variant":"Wie erreicht ein PC ein Ziel außerhalb seines lokalen Subnetzes, wenn sein Gateway richtig gesetzt ist?"},{"id":"E03-Q04","module":3,"number":4,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche Aussagen zu DHCPv6 Stateless und Stateful treffen zu?","choices":["Im Stateless-Modus bildet der Host seine Adresse über SLAAC und bezieht Zusatzinformationen über DHCPv6.","DHCPv6-Clients suchen Server per IPv4-Broadcast.","SLAAC benötigt zwingend einen zentralen, zustandsführenden DHCPv6-Server.","Im Stateful-Modus vergibt der DHCPv6-Server routbare IPv6-Adressen und führt darüber Buch.","Im Stateful-Modus legt DHCPv6 das Standard-Gateway ohne Router Advertisement fest."],"correct":[0,3],"explanation":"Stateless DHCPv6 liefert Zusatzdaten, die IPv6-Adresse entsteht über SLAAC. Stateful DHCPv6 vergibt und verwaltet Adressen selbst; das Default Gateway kommt weiterhin über Router Advertisements.","variant":"Welche Angaben zu zustandslosem und zustandsbehaftetem DHCPv6 sind korrekt?"},{"id":"E03-Q05","module":3,"number":5,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche Aussagen über Directly Connected Routes treffen zu?","choices":["Sie verschwinden aus der Routingtabelle, wenn das zugehörige Interface ausfällt.","Sie werden in einer Routingtabelle mit dem Quellcode C gekennzeichnet.","Sie benötigen immer einen manuell eingetragenen Next Hop.","Sie werden durch RIP von einem Nachbarrouter gelernt.","Sie entstehen automatisch, wenn ein Interface aktiv ist und eine IP-Adresse mit Subnetzmaske besitzt."],"correct":[0,1,4],"explanation":"Direkt angeschlossene Routen entstehen bei korrekt konfigurierten, aktiven Schnittstellen automatisch. In Cisco-Routingtabellen sind sie oft mit C gekennzeichnet.","variant":"Welche Einträge erzeugt ein aktives Router-Interface selbst in der Routingtabelle?"},{"id":"E03-Q06","module":3,"number":6,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche der folgenden Aussagen zu DNS-Einträgen im Dual-Stack-Betrieb ist korrekt?","choices":["Ein A-Record enthält die IPv6-Adresse eines Dienstes.","Ein AAAA-Record liefert die IPv6-Adresse eines Dienstes.","Ein AAAA-Record kapselt IPv6-Pakete in IPv4-Pakete.","Bei vorhandenem A- und AAAA-Record kann ein Client kein Protokoll auswählen.","Ist nur ein A-Record vorhanden, wird automatisch IPv6 verwendet."],"correct":[1],"explanation":"A steht für eine IPv4-Adresse. AAAA enthält eine IPv6-Adresse; beide können für denselben Dienst gleichzeitig vorhanden sein.","variant":"Welcher DNS-Record enthält bei Dual Stack die IPv6-Adresse eines Hosts?"},{"id":"E03-Q07","module":3,"number":7,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche der folgenden Aussagen zu Portbereichen trifft zu?","choices":["Dynamisch vergebene Ports liegen im Bereich von 49152 bis 65535.","Portnummern haben keine Bedeutung für die Zuordnung von Daten zu Anwendungen.","Alle Ports oberhalb von 1023 sind Well-Known Ports.","Port 80 gehört zu den dynamisch vergebenen Ports.","Registered Ports liegen im Bereich von 0 bis 1023."],"correct":[0],"explanation":"Dynamische oder private Ports reichen von 49152 bis 65535 und werden unter anderem vorübergehend für Client-Verbindungen verwendet.","variant":"Welche Aussagen über die dynamischen Portnummern des TCP/UDP-Portbereichs stimmen?"},{"id":"E03-Q08","module":3,"number":8,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Für welches Szenario eignet sich eine Aufteilung mit fester Präfixlänge besonders?","choices":["Ein Serverbereich benötigt 6 Hosts, ein Clientnetz dagegen 100 Hosts.","Jeder Bereich soll bewusst eine individuell unterschiedliche Präfixlänge erhalten.","Mehrere Bereiche benötigen ungefähr gleich viele Hostadressen.","Ein Lager benötigt 100 Hosts, eine WAN-Verbindung aber nur 2 Hosts."],"correct":[2],"explanation":"Feste Präfixlängen (FLSM) ergeben gleich große Subnetze und passen besonders bei ähnlichem Adressbedarf.","variant":"In welchem Fall eignen sich gleich große Teilnetze mit einer einheitlichen Präfixlänge?"},{"id":"E03-Q09","module":3,"number":9,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welchem Dezimalwert entspricht der Hexadezimalwert 0xB4?","choices":["184","176","180","196"],"correct":[2],"explanation":"Die Hex-Ziffer B entspricht 11. Daher gilt B4 = 11 × 16 + 4 = 180.","variant":"Welche Dezimalzahl erhältst du, wenn du den Hexadezimalwert B4 umrechnest?"},{"id":"E03-Q10","module":3,"number":10,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Wie lautet die vollständig komprimierte Schreibweise von 2001:0db8:4a2f:0001:0000:0000:0000:0001?","choices":["2001:db8:4a2f:1::1","2001:db8:4a2f::1::1","2001:db8:4a2f:1:0:0:0:1","2001:db8:4a2f:1::0"],"correct":[0],"explanation":"Führende Nullen pro Block werden gestrichen; eine zusammenhängende Nullblockfolge darf einmal mit :: zusammengefasst werden.","variant":"Wie kürzt man die angegebene IPv6-Adresse mit entfernten führenden Nullen und doppeltem Doppelpunkt korrekt?"},{"id":"E03-Q11","module":3,"number":11,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche Aussagen zu IPv6-Multicast treffen zu?","choices":["Eine Solicited-Node-Multicast-Adresse beginnt mit ff02::1:ff und wird bei der Adressauflösung verwendet.","ff02::2 adressiert alle Router im lokalen Link.","ff02::1 adressiert alle Knoten im lokalen Link.","Eine Multicast-Adresse identifiziert genau eine einzelne Schnittstelle.","IPv6 verwendet keine Broadcast-Adressen, sondern unter anderem gezielte Multicast-Gruppen."],"correct":[0,1,2,4],"explanation":"IPv6 nutzt Multicast statt Broadcast. ff02::1 erreicht alle Knoten des Links, ff02::2 alle Router; die Solicited-Node-Gruppe hilft bei Neighbor Discovery.","variant":"Welche Aussagen zu IPv6-Multicastgruppen für Router, Hosts und Neighbor Discovery sind richtig?"},{"id":"E03-Q12","module":3,"number":12,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welche Aussage beschreibt eine IPv6-Link-Local-Adresse korrekt?","choices":["Sie ist nur innerhalb eines einzelnen Segments gültig und wird nicht geroutet.","Sie wird nur bei fehlender DHCPv6-Antwort vergeben.","Sie ersetzt eine Global-Unicast-Adresse für externe Verbindungen.","Sie ist im gesamten Internet routbar."],"correct":[0],"explanation":"Eine Link-Local-Adresse gilt nur auf der lokalen Verbindung. Router leiten solche IPv6-Adressen nicht über Netzgrenzen.","variant":"Wodurch unterscheidet sich eine IPv6-Link-Local-Adresse von routbaren globalen Adressen?"},{"id":"E03-Q13","module":3,"number":13,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welche Netzadresse gehört zur Hostadresse 10.20.5.20/28?","choices":["10.20.5.20","10.20.5.0","10.20.5.31","10.20.5.16"],"correct":[3],"explanation":"Ein /28 umfasst Blöcke zu je 16 Adressen: 0–15, 16–31, 32–47. Die .20 gehört deshalb zum Netz .16.","variant":"Welche Netzadresse ergibt sich für den Host 10.20.5.20 mit der Maske /28?"},{"id":"E03-Q14","module":3,"number":14,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche Aussagen zur Auswahl einer Route durch einen Router sind korrekt?","choices":["Bei gleicher Präfixlänge wird die Route mit der niedrigeren administrativen Distanz bevorzugt.","Bei gleichem Präfix, gleicher administrativer Distanz und innerhalb desselben Protokolls gewinnt die niedrigere Metrik.","Metriken aus RIP und OSPF können direkt miteinander verglichen werden.","Das Longest-Prefix-Match wird vor administrativer Distanz und Metrik geprüft.","Eine Default-Route wird immer vor einer spezifischeren Route verwendet."],"correct":[0,1,3],"explanation":"Bei der Weiterleitung gewinnt zunächst die spezifischste passende Route. Zwischen passenden Kandidaten gleicher Präfixlänge zählen beispielsweise administrative Distanz und Metrik.","variant":"Was beeinflusst die Routenwahl hinsichtlich Präfixlänge, administrativer Distanz und Metrik?"},{"id":"E03-Q15","module":3,"number":15,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welche zusammengefasste Route entsteht aus 10.20.2.192/27 und 10.20.2.224/27?","choices":["10.20.2.192/27","10.20.2.192/25","10.20.2.192/26","10.20.2.224/26"],"correct":[2],"explanation":"Zwei benachbarte /27-Netze mit Start .192 und .224 lassen sich zu einem ausgerichteten /26-Netz ab .192 zusammenfassen.","variant":"Welches gemeinsame Netz deckt die beiden aneinanderliegenden /27-Blöcke korrekt ab?"},{"id":"E03-Q16","module":3,"number":16,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche Schritte gehören zur systematischen Fehlersuche bei einem nicht erreichbaren Ziel in einem entfernten Subnetz?","choices":["Zuerst Firewall-Regeln verändern, bevor die lokale Konfiguration geprüft wird.","Traceroute oder Tracert verwenden, um den Pfad Hop für Hop zu untersuchen.","Auf dem Router kontrollieren, ob eine passende Route zum Zielnetz vorhanden ist.","IP-Adresse, Subnetzmaske und Default Gateway des betroffenen Hosts mit dem Adressplan vergleichen.","Das eigene Default Gateway mit ping auf Erreichbarkeit prüfen."],"correct":[1,2,3,4],"explanation":"Zuerst die lokale IP-Konfiguration und das Gateway prüfen, anschließend Traceroute und die Routingtabellen. So grenzt man einen Fehler systematisch ein.","variant":"Wie suchst du methodisch nach einem Routingfehler, wenn ein fremdes Subnetz unerreichbar ist?"},{"id":"E03-Q17","module":3,"number":17,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"multi","question":"Welche Aussagen zum VLSM-Design für Verden treffen zu?","choices":["Das Lager erhält den Block 10.20.4.0/25.","Die Fertigung erhält den Block 10.20.4.128/25.","Die Verwaltung erhält den Block 10.20.4.192/27.","Die Standortkopplung nutzt den Block 10.20.4.208/30.","Alle vier Teilnetze verwenden dieselbe Präfixlänge."],"correct":[0,3],"explanation":"100 Hosts brauchen mindestens ein /25-Netz mit 126 nutzbaren Adressen. Ein /30 bietet zwei klassische nutzbare Hostadressen für eine Router-zu-Router-Verbindung.","variant":"Welche der genannten Netzblöcke passen zum vorgeschlagenen VLSM-Plan für den Standort Verden?"},{"id":"E03-Q18","module":3,"number":18,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"single","question":"Welcher Schritt erfolgt bei einer VLSM-Planung mit mehreren Anforderungen zuerst?","choices":["Die Adressen werden zunächst beliebig verteilt und danach ausgerichtet.","Die kleinste Hostanforderung wird zuerst platziert.","Alle Bereiche erhalten zunächst dieselbe Präfixlänge.","Die Anforderungen werden absteigend nach benötigter Hostzahl sortiert."],"correct":[3],"explanation":"Beim VLSM werden zuerst die größten Host-Anforderungen eingeplant. So kann man die verbleibenden kleineren Blöcke ohne Überschneidungen verteilen.","variant":"Welche Hostgruppe erhält bei der Planung variabler Netzgrößen zuerst Platz?"},{"id":"E03-Q19","module":3,"number":19,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"tf","question":"RIP bewertet die Bandbreite der Verbindungen, um den besten Pfad zu einem Ziel auszuwählen.","choices":["Wahr","Falsch"],"correct":[1],"explanation":"Falsch: RIP bewertet Wege anhand der Hop-Anzahl, nicht ihrer Bandbreite.","variant":"RIP entscheidet über die optimale Route anhand der Bandbreite der Links. Wahr oder falsch?"},{"id":"E03-Q20","module":3,"number":20,"source":"Frage 1(1).docx","topic":"Subnetting, IPv6 & Routing","kind":"tf","question":"Beim Source NAT ersetzt ein Router oder eine Firewall die Quell-IP-Adresse eines Pakets; dieses Verfahren ist typisch für private Internetzugänge.","choices":["Wahr","Falsch"],"correct":[0],"explanation":"Wahr: Source NAT ersetzt bei ausgehenden Verbindungen die Quell-IP und ist etwa bei privaten Internetanschlüssen üblich.","variant":"Bei Source NAT wird beim Weiterleiten die Quell-IP eines Pakets verändert. Wahr oder falsch?"},{"id":"E04-Q01","module":4,"number":1,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Maßnahmen gehören zu einem vollständigen Wireless Site Survey?","choices":["Nur ein Frequenzband messen, weil die Abdeckung in allen Bändern gleich ist","Grundrisse und Baupläne auf mögliche Hindernisse und Störquellen prüfen","AP-Standorte vor Ort mit Survey-Software auf Signalstärke und Datenrate messen","Eine physische Begehung durchführen und Anschlüsse sowie Stromversorgung prüfen","Die Planung ausschließlich anhand eines leeren Gebäudeplans abschließen"],"correct":[1,2,3],"explanation":"Ein WLAN-Site-Survey kombiniert Planprüfung, Begehung und Messungen vor Ort. Nur so lassen sich Störquellen und geeignete AP-Standorte beurteilen.","variant":"Welche Schritte sind erforderlich, um einen WLAN-Site-Survey fachgerecht durchzuführen?"},{"id":"E04-Q02","module":4,"number":2,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Zwei Switch-Ports sind für LACP auf beiden Seiten im Modus passive konfiguriert. Warum entsteht kein logischer Kanal?","choices":["Ein über LACP gebildeter Port-Channel kann nicht als Trunk konfiguriert werden.","Mindestens eine Seite muss im Modus active arbeiten.","Die Channel-Group-Nummer muss auf beiden Switches technisch identisch sein.","Beide Seiten müssen zwingend im Modus active arbeiten."],"correct":[1],"explanation":"LACP passive wartet auf die Gegenseite. Mindestens ein Port muss active sein, damit die Aushandlung startet.","variant":"Warum kommt bei LACP keine Bündelung zustande, wenn beide Enden passive nutzen?"},{"id":"E04-Q03","module":4,"number":3,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Wie verarbeitet ein Hub ein eingehendes Signal?","choices":["Er verstärkt es und leitet es unverändert an alle anderen Ports weiter.","Er prüft die Ziel-IP-Adresse und wählt eine Route aus.","Er versieht den Frame mit einer VLAN-Kennung.","Er lernt die Quell-MAC-Adresse und leitet gezielt zum Zielport weiter."],"correct":[0],"explanation":"Ein Hub arbeitet auf Layer 1 und wiederholt Eingangssignale an den übrigen Ports, ohne Zieladressen auszuwerten.","variant":"Was tut ein Ethernet-Hub auf Bitübertragungsschicht mit einem ankommenden Signal?"},{"id":"E04-Q04","module":4,"number":4,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Aussage zu den klassischen STP-Portzuständen trifft zu?","choices":["Im Zustand Blocking leitet ein Port regulären Datenverkehr weiter.","Im Zustand Forwarding wertet ein Port nur BPDUs aus, ohne MAC-Adressen zu lernen.","Im Zustand Learning lernt der Switch MAC-Adressen, leitet aber noch keinen regulären Verkehr weiter.","Im Zustand Listening leitet ein Port bereits Nutzdaten weiter.","Ein Disabled-Port nimmt aktiv am STP-Prozess teil."],"correct":[2],"explanation":"Ein Port im klassischen STP-Zustand Learning lernt MAC-Adressen, leitet aber noch keinen normalen Nutzerverkehr weiter.","variant":"Welcher Satz beschreibt den STP-Portzustand Learning richtig?"},{"id":"E04-Q05","module":4,"number":5,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Wie weit wird ein Broadcast eines Hosts in VLAN 10 ohne Routing weitergeleitet?","choices":["Nur zu Ports im Native VLAN des Switches","Zu allen Ports desselben Switches, unabhängig vom VLAN","Erst nach einer Weiterleitung über das Default Gateway","Zu anderen Ports desselben VLANs"],"correct":[3],"explanation":"Jedes VLAN ist eine eigene Broadcast-Domäne. Ohne Routing bleibt der Broadcast innerhalb des VLANs.","variant":"Wie weit verteilt sich ein Broadcast in einem Switch-Netz, wenn er zu VLAN 10 gehört?"},{"id":"E04-Q06","module":4,"number":6,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Welcher Switch ist geeignet, wenn VLANs, Port Security und detaillierte Portstatistiken benötigt werden?","choices":["Eine Bridge","Ein Hub","Ein Managed Switch","Ein Unmanaged Switch"],"correct":[2],"explanation":"Ein Managed Switch lässt sich konfigurieren und bietet beispielsweise VLANs, Port Security und Portstatistiken.","variant":"Welcher Gerätetyp erlaubt konfigurierbare VLANs, Port Security und genaue Portauswertungen?"},{"id":"E04-Q07","module":4,"number":7,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Welcher Switch wird durch Spanning Tree Protocol zur Root Bridge gewählt?","choices":["Der Switch mit der niedrigsten Bridge-ID","Der Switch mit der höchsten Bridge-ID","Der Switch mit der höchsten Anzahl aktiver Ports","Der Switch mit dem schnellsten Uplink"],"correct":[0],"explanation":"STP bestimmt die Root Bridge anhand der niedrigsten Bridge-ID, bestehend vor allem aus Priorität und MAC-Adresse.","variant":"Welche Bridge-ID ist bei der Wahl der Root Bridge durch STP entscheidend?"},{"id":"E04-Q08","module":4,"number":8,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Was ist die direkte Folge, wenn bei Router-on-a-Stick die einzige physische Trunk-Verbindung zum Router ausfällt?","choices":["Nur das Native VLAN kann nicht mehr geroutet werden.","Die Access-Ports führen das Inter-VLAN-Routing automatisch weiter aus.","Die SVIs des Switches übernehmen automatisch das Routing.","Das Routing für alle VLANs über die Subinterfaces fällt aus."],"correct":[3],"explanation":"Beim Router-on-a-Stick laufen alle VLANs über einen gemeinsamen Trunk. Bricht dieser ab, fällt darüber das gesamte Inter-VLAN-Routing aus.","variant":"Welche Auswirkung hat ein defekter Router-Trunk im Router-on-a-Stick-Aufbau?"},{"id":"E04-Q09","module":4,"number":9,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Mit welchem Befehl wird die aktuelle Running-Config so gespeichert, dass sie nach einem Neustart erhalten bleibt?","choices":["configure terminal","interface range GigabitEthernet0/1-24","show running-config","copy running-config startup-config"],"correct":[3],"explanation":"copy running-config startup-config sichert die aktuelle Konfiguration dauerhaft für spätere Neustarts.","variant":"Welcher Cisco-Befehl sorgt dafür, dass die Running-Config nach einem Neustart erhalten bleibt?"},{"id":"E04-Q10","module":4,"number":10,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Voraussetzungen müssen für nahtloses Roaming innerhalb einer Extended Service Area erfüllt sein?","choices":["Die beteiligten Access Points verwenden identische Sicherheitseinstellungen.","Die beteiligten Access Points senden dieselbe ESSID.","Benachbarte Access Points müssen zwingend denselben Funkkanal verwenden.","Zwischen den Basic Service Areas darf keine Signalüberlappung bestehen.","Die beteiligten Access Points sind über dasselbe Distribution System verbunden."],"correct":[0,1,4],"explanation":"Für Roaming brauchen die Access Points dieselbe SSID und kompatible Sicherheitseinstellungen; sie gehören außerdem zu einer verbundenen Infrastruktur.","variant":"Welche Eigenschaften müssen Access Points für ein gemeinsames WLAN und Roaming erfüllen?"},{"id":"E04-Q11","module":4,"number":11,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Was identifiziert eine BSSID in einer WLAN-Infrastruktur eindeutig?","choices":["Das kabelgebundene Distribution System","Das IP-Subnetz eines WLANs","Ein einzelnes Basic Service Set eines Access Points","Den Netzwerknamen eines Extended Service Sets"],"correct":[2],"explanation":"BSSID benennt ein bestimmtes Basic Service Set und unterscheidet es auch dann von anderen, wenn mehrere APs dieselbe SSID senden.","variant":"Was beschreibt eine BSSID innerhalb eines WLANs?"},{"id":"E04-Q12","module":4,"number":12,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Maßnahmen eignen sich zum Absichern ungenutzter Switch-Ports?","choices":["Ungenutzte Ports zu einer LACP-Bündelung zusammenfassen","Ungenutzte Ports mit shutdown administrativ deaktivieren","Ungenutzte Ports grundsätzlich als Trunks konfigurieren","Ungenutzte Ports im Default-VLAN 1 belassen","Ungenutzte Ports einem Sinkhole-VLAN ohne Routing-Anbindung zuweisen"],"correct":[1,4],"explanation":"Nicht genutzte Ports werden administrativ deaktiviert und können zusätzlich einem isolierten Sinkhole-VLAN zugeordnet werden.","variant":"Welche Maßnahmen machen nicht benötigte Switch-Anschlüsse sicherer?"},{"id":"E04-Q13","module":4,"number":13,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Aussagen zu WPA3 treffen zu?","choices":["WPA3 verwendet GCMP anstelle von CCMP.","Der Schutz von Management-Frames nach 802.11w ist bei WPA3 verbindlich.","Im WPA3-Transition-Mode verwenden alle Clients zwingend WPA3-SAE.","SAE erschwert Offline-Rateangriffe auf eine Passphrase.","Wi-Fi Enhanced Open ermöglicht verschlüsselten Verkehr ohne Passphrase."],"correct":[0,1,3,4],"explanation":"WPA3 verbessert den Schutz durch SAE und verpflichtende geschützte Managementframes. Enhanced Open verwendet OWE. Hinweis: Die konkrete Datenverschlüsselung hängt vom WPA3-Modus ab; GCMP ist nicht bei jedem WPA3-Personal-Netz zwingend.","variant":"Welche der folgenden Merkmale von WPA3, SAE, Managementschutz und Enhanced Open treffen zu?"},{"id":"E04-Q14","module":4,"number":14,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"tf","question":"Ein WIPS erkennt Auffälligkeiten nur und greift niemals automatisiert in Verbindungen zu Rogue Access Points ein.","choices":["Wahr","Falsch"],"correct":[1],"explanation":"Falsch: Ein WIPS kann unerwünschte Zugangspunkte nicht nur erkennen, sondern abhängig von Produkt und Konfiguration auch Gegenmaßnahmen auslösen.","variant":"Ein WIPS kann erkannte Rogue APs grundsätzlich nur melden und nie automatisch eingreifen. Wahr oder falsch?"},{"id":"E04-Q15","module":4,"number":15,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"tf","question":"Ein Dual-Band-WLAN-Adapter besitzt für sein 2,4-GHz- und sein 5-GHz-Funkmodul jeweils eine eigene MAC-Adresse.","choices":["Wahr","Falsch"],"correct":[0],"explanation":"Wahr im beschriebenen Kurs-Szenario: Funkmodule können jeweils eine eigene MAC-Adresse besitzen; das gilt jedoch nicht zwingend für jedes physische Dual-Band-Gerät.","variant":"Ein Dual-Band-Adapter kann für 2,4- und 5-GHz-Funkmodule jeweils eine eigene MAC-Adresse besitzen. Wahr oder falsch?"},{"id":"E04-Q16","module":4,"number":16,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Maßnahmen kann EMM beziehungsweise MDM für BYOD-Geräte unterstützen?","choices":["Apps außerhalb offizieller App-Stores verbieten","Ein verpflichtendes Geräte-Passwort durchsetzen","Private Fotos und private Apps automatisch vollständig der Unternehmensverwaltung offenlegen","Eine Mindestversion des Betriebssystems verlangen","Bei Verlust gezielt Unternehmensdaten fernlöschen"],"correct":[0,1,3,4],"explanation":"MDM/EMM kann Firmenrichtlinien, Updates, App-Einschränkungen und gezieltes Entfernen von Unternehmensdaten unterstützen, ohne private Daten vollständig offenzulegen.","variant":"Welche BYOD-Sicherheitsregeln können Systeme für MDM und EMM durchsetzen?"},{"id":"E04-Q17","module":4,"number":17,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Aussage zur Erkennung eines PoE-fähigen Endgeräts trifft zu?","choices":["PoE überträgt nur Daten, aber keine elektrische Energie.","Ein PoE-Switch liefert an jedem angeschlossenen Gerät grundsätzlich sofort Strom.","Das Powered Device prüft zuerst, ob der Switch als PSE geeignet ist.","Das PSE sendet zunächst ein niedriges Prüfsignal und prüft die elektrische Reaktion des Geräts.","PoE benötigt zusätzlich zum Netzwerkkabel ein separates Stromkabel."],"correct":[3],"explanation":"Das PSE, etwa ein PoE-Switch, prüft zunächst elektrisch das angeschlossene Gerät und liefert erst dann reguläre PoE-Leistung.","variant":"Wie stellt ein PoE-fähiger Switch fest, ob er einem Gerät Leistung bereitstellen darf?"},{"id":"E04-Q18","module":4,"number":18,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"multi","question":"Welche Aussagen zur Konfiguration und Prüfung eines Native VLAN treffen zu?","choices":["Das Native VLAN ordnet getaggte Frames einem VLAN zu.","show interfaces trunk zeigt die konfigurierte Native-VLAN-ID eines Trunk-Ports an.","Ein Endgerät an einem Access-Port fügt seine 802.1Q-Tags selbst ein.","Das Native VLAN muss immer VLAN 1 bleiben.","Beide Enden einer Trunk-Verbindung müssen dieselbe Native-VLAN-ID verwenden."],"correct":[1,4],"explanation":"Beide Seiten eines 802.1Q-Trunks müssen dasselbe Native VLAN verwenden. Mit show interfaces trunk lässt sich die Einstellung kontrollieren.","variant":"Was ist bei einem 802.1Q-Trunk für das Native VLAN auf beiden Seiten nötig?"},{"id":"E04-Q19","module":4,"number":19,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Ein Client misst einen RSSI von -65 dBm bei einem Rauschpegel von -90 dBm. Welchen SNR-Wert ergibt das?","choices":["155 dB","25 dB","35 dB","15 dB"],"correct":[1],"explanation":"SNR = Signalpegel minus Rauschpegel, also −65 dBm − (−90 dBm) = 25 dB.","variant":"Wie groß ist die Differenz zwischen −65 dBm Empfangssignal und −90 dBm Rauschen?"},{"id":"E04-Q20","module":4,"number":20,"source":"Frage 11(1).docx","topic":"Switching & WLAN-Sicherheit","kind":"single","question":"Welche Aufgabe übernimmt der Authentication Server, meist ein RADIUS-Server, bei 802.1X?","choices":["Er prüft die Zugangsdaten zentral gegen ein Verzeichnis.","Er blockiert regulären Datenverkehr bis zum Abschluss von EAPoW.","Er ist das Endgerät, das Zugang zum WLAN anfordert.","Er leitet Zugangsdaten weiter, ohne sie selbst zu prüfen."],"correct":[0],"explanation":"Bei 802.1X prüft der RADIUS-Server zentral die Anmeldedaten. Access Point oder Switch vermittelt zwischen Client und Authentifizierungsserver.","variant":"Welche Rolle übernimmt bei 802.1X typischerweise der RADIUS-Server?"},{"id":"E05-Q01","module":5,"number":1,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussagen zu APIPA treffen zu?","choices":["APIPA liefert automatisch ein Standardgateway und DNS-Server.","APIPA ist die IPv6-Variante von SLAAC.","Mit APIPA kann ein Host andere Subnetze erreichen.","Windows verwendet bei ausbleibender DHCP-Antwort eine Adresse aus 169.254.0.0/16.","APIPA ist ein DHCP-Pool für kurzfristige Gastzugänge."],"correct":[3],"explanation":"APIPA vergibt unter Windows oft automatisch eine IPv4-Adresse aus 169.254.0.0/16, wenn keine DHCP-Antwort vorliegt. Ein Gateway liefert APIPA nicht.","variant":"Welche Beschreibung passt zur automatischen IPv4-Adresswahl APIPA bei einem DHCP-Problem?"},{"id":"E05-Q02","module":5,"number":2,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"single","question":"Wofür wird ein CNAME-Record im DNS verwendet?","choices":["Für die Benennung autoritativer DNS-Server einer Zone.","Für die Zuordnung eines Hostnamens zu einer IPv4-Adresse.","Für die Festlegung von Mailservern mit Präferenzwerten.","Für einen Alias auf einen bestehenden Host-Record."],"correct":[3],"explanation":"Ein CNAME macht aus einem Namen einen Alias für einen anderen DNS-Namen. Eine direkte IPv4-Zuordnung ist dagegen ein A-Record.","variant":"Was ist die Funktion eines CNAME-DNS-Eintrags?"},{"id":"E05-Q03","module":5,"number":3,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussagen zum Datenschutz bei Netzwerkdokumentation treffen zu?","choices":["Netzwerkdokumentation soll nach dem Need-to-know-Prinzip geschützt, versioniert und gesichert werden.","Ein Werksreset entfernt Datenreste auf allen Medien zuverlässig.","Logs dürfen unbegrenzt gespeichert werden, wenn sie bei der Fehlersuche helfen könnten.","Ein Verzeichnis von Verarbeitungstätigkeiten dokumentiert unter anderem Zweck, Datenkategorien und Löschfristen.","DHCP-, Proxy- und Firewall-Logs können personenbezogene Daten enthalten."],"correct":[0,3,4],"explanation":"Netzwerkdokumentation und Logs können sensible beziehungsweise personenbezogene Informationen enthalten und müssen beschränkt, geschützt und nach Regeln aufbewahrt werden.","variant":"Welche Sicherheits- und Datenschutzregeln gelten für Netzwerkdokumentation und Logdaten?"},{"id":"E05-Q04","module":5,"number":4,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"single","question":"Warum sendet ein Client im DORA-Ablauf den DHCPREQUEST als Broadcast?","choices":["Damit der Router das Paket als DHCP-Relay an den Server weiterleitet.","Damit andere DHCP-Server erkennen, dass ihr Angebot nicht ausgewählt wurde.","Damit der ursprüngliche DHCP-Server die Lease per Unicast verlängert.","Damit der Client die angebotene Adresse per ARP auf Belegung prüft."],"correct":[1],"explanation":"Bei DHCPREQUEST im DORA-Ablauf erfahren auch andere DHCP-Server, welches Angebot der Client angenommen hat.","variant":"Weshalb wird DHCPREQUEST beim anfänglichen DORA-Ablauf im Broadcast verteilt?"},{"id":"E05-Q05","module":5,"number":5,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussage zu DNSSEC, DoT und DoH trifft zu?","choices":["DNS over HTTPS verwendet TCP-Port 853.","DoT signiert DNS-RRsets wie DNSSEC.","DNS over TLS verwendet TCP-Port 443.","DNSSEC verschlüsselt den Transportweg zwischen Client und Resolver.","DNSSEC prüft die Echtheit von DNS-Antworten mithilfe von Signaturen."],"correct":[4],"explanation":"DNSSEC schützt die Authentizität und Integrität von DNS-Daten durch Signaturen. DNS over TLS/HTTPS betrifft dagegen einen verschlüsselten Transport.","variant":"Welcher Satz erklärt DNSSEC korrekt im Vergleich zu verschlüsselten DNS-Transportverfahren?"},{"id":"E05-Q06","module":5,"number":6,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"single","question":"Welche Aufgabe hat das Feld giaddr, das ein DHCP-Relay-Agent füllt?","choices":["Es markiert eine angebotene Adresse als dauerhaft reserviert.","Es ermöglicht dem DHCP-Server die Auswahl des passenden Scopes.","Es übermittelt dem DHCP-Server die MAC-Adresse des Clients.","Es legt den DNS-Server für den Client fest."],"correct":[1],"explanation":"giaddr übermittelt beim DHCP-Relay die Gateway-Adresse des Client-Netzes. Dadurch kann der Server das richtige Adresssegment wählen.","variant":"Wie hilft giaddr dem DHCP-Server, trotz DHCP-Relay die richtige Adressvergabe zu wählen?"},{"id":"E05-Q07","module":5,"number":7,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"single","question":"Welche Komponente einer Flow-Analyse zählt Pakete und Bytes im Flow-Cache und exportiert die Daten?","choices":["Der SNMP-Agent.","Der Exporter.","Der Analyzer.","Der Collector."],"correct":[1],"explanation":"Der Flow-Exporter zählt und sammelt Flow-Daten auf Router, Switch oder Firewall und exportiert sie zur Auswertung.","variant":"Welche Flow-Monitoring-Komponente sammelt Paket- und Bytezähler und sendet sie weiter?"},{"id":"E05-Q08","module":5,"number":8,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussagen zu IPAM und NetBox treffen zu?","choices":["NetBox ist ein Monitoring-System für Verfügbarkeit und Performance.","Eine manuell gepflegte Excel-Liste erkennt Adresskonflikte automatisch.","IPAM kann Adressbereiche scannen, um undokumentierte statische Adressen zu finden.","IPAM kann DHCP- und DNS-Daten abfragen und die Adressnutzung protokollieren.","Das Change Log von NetBox kann Änderungen mit Zeitstempel, Benutzer und Vorher-Nachher-Zustand festhalten."],"correct":[2,3,4],"explanation":"IPAM kann Adressnutzung dokumentieren und mit DHCP/DNS abgleichen; NetBox erfasst Veränderungen nachvollziehbar im Change Log.","variant":"Welche Aussagen über IP-Adressmanagement und Änderungsprotokolle in NetBox treffen zu?"},{"id":"E05-Q09","module":5,"number":9,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussagen zu SPAN, TCP-Mitschnitten und Wireshark-Filtern treffen zu?","choices":["Display-Filter wirken auf aufgezeichnete Pakete und können jederzeit angepasst werden.","An einem normalen Switchport sieht ein Sniffer fremde Unicasts normalerweise nicht.","Capture-Filter wirken vor der Aufzeichnung und können während des Mitschnitts nicht geändert werden.","SPAN kopiert ausgewählte Frames auf einen Monitorport, kann aber unter hoher Last Frames verlieren.","Follow TCP Stream zeigt bei TLS-Verbindungen den Inhalt als lesbaren Klartext."],"correct":[0,1,2,3],"explanation":"Capture-Filter wählen schon bei der Aufzeichnung aus. Display-Filter zeigen später nur einen Ausschnitt. SPAN spiegelt Frames auf einen Monitorport.","variant":"Was stimmt über Capture- und Display-Filter sowie SPAN bei der Paketanalyse?"},{"id":"E05-Q10","module":5,"number":10,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussagen zu Discovery und Monitoring treffen zu?","choices":["Verfügbarkeitsmonitoring kann HTTP-Statuscodes und den Ablauf von Zertifikaten überwachen.","Konfigurationsmonitoring kann die Produktionskonfiguration mit einer Golden Configuration abgleichen.","Performance-Monitoring bewertet Auslastung, CPU oder Fehlerraten im Vergleich zu einer Baseline.","Host Discovery kann mit Verfahren wie Ping oder ARP prüfen, ob eine Adresse aktiv ist.","Flow-Export überträgt den vollständigen Nutzinhalt jedes einzelnen Pakets."],"correct":[0,1,2,3],"explanation":"Host Discovery findet aktive Geräte. Verfügbarkeits-, Konfigurations- und Performance-Monitoring überwachen jeweils andere Aspekte.","variant":"Welche Aufgaben gehören zu Host Discovery und den verschiedenen Monitoring-Bereichen?"},{"id":"E05-Q11","module":5,"number":11,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"multi","question":"Welche Aussagen zu NTP treffen zu?","choices":["NTP überträgt UTC; Zeitzone und Sommerzeit werden auf dem Gerät eingestellt.","Slew korrigiert kleine Abweichungen durch einen sofortigen Zeitsprung.","Nach einer ersten Synchronisation muss NTP die Zeitquelle nicht erneut abfragen.","NTP verwendet UDP-Port 123.","NTP überträgt standardmäßig die lokale Zeit inklusive Sommerzeit."],"correct":[0,3],"explanation":"NTP verwendet UDP-Port 123 und synchronisiert UTC. Sommerzeit und Zeitzone stellt das Endgerät selbst dar.","variant":"Welche Aussagen zu NTP, UTC, UDP-Port und Zeitzonen sind richtig?"},{"id":"E05-Q12","module":5,"number":12,"source":"Frage 1(2).docx","topic":"Netzwerkdienste & Monitoring","kind":"single","question":"Was be function normalizeSession(s){

 for(const [key,grade] of Object.entries(s.grades)){
