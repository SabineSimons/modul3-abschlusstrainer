 <div class="actions" style="margin-bottom:15px"><button class="btn smol" data-act="speakQuestion">🔊 Frage und Antworten vorlesen</button><button class="btn smol" data-act="stopSpeak">■ Stopp</button><button class="btn smol" data-act="toggleFlag">${mem.flags[q.id]?'⚑ Markierung entfernen':'⚑ Frage markieren'}</button></div>
 <div id="answers" class="answers">${opts}</div>${!exam&&!graded?`<div class="easy-check"><button class="btn primary" data-act="check">✓ Jetzt Antwort prüfen</button><span class="small muted" style="margin-left:8px">Danach erscheinen Erklärung und Wiederholung.</span></div>`:''}
 ${graded?`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ Richtig!':'✕ Nicht richtig – hier ist die Lösung'}</strong><p class="small">Deine Auswahl: <b>${ans.map(i=>String.fromCharCode(65+i)).join(', ')||'–'}</b> · Richtig: <b>${q.correct.map(i=>String.fromCharCode(65+i)).join(', ')}</b></p><div class="small"><b>Richtige Antwort${q.correct.length>1?'en':''}:</b>${q.correct.map(i=>`<div>${String.fromCharCode(65+i)}. ${esc(q.choices[i])}</div>`).join('')}</div><p style="margin:10px 0"><b>Erklärung:</b> ${esc(q.explanation)}</p><div class="actions"><button class="btn smol" data-act="speakExplanation">🔊 Erklärung vorlesen</button><button class="btn positive" data-act="retryCurrent">↻ Frage erneut versuchen</button><button class="btn" data-act="showErrors">Fehlerliste ansehen</button><button class="btn smol" data-act="startErrors" ${wrongIDs().length?'':'disabled'}>Fehlertraining (${wrongIDs().length})</button></div></div>`:''}
 <div class="sep"></div><div class="actions">${ses.index?' <button class="btn" data-act="prev">← Zurück</button>':''}${ses.index+1<num?'<button class="btn" data-act="next">Nächste Frage →</button>':''}${!exam?'<button class="btn positive" data-act="finishTraining">Training auswerten</button>':'<button class="btn danger" data-act="finishExam">Prüfung abgeben</button>'}<button class="btn ghost" data-act="goHome">⌂ Zur Startseite</button></div>
 <div class="sep"></div><div class="actions"><button class="btn smol" data-act="showErrors">Fehlerliste (${wrongIDs().length})</button><button class="btn smol" data-act="startErrors" ${wrongIDs().length?'':'disabled'}>↻ Fehlertraining (${wrongIDs().length})</button><button class="btn smol" data-act="resetModule" data-module="${q.module}">Diesen Bereich zurücksetzen</button><button class="btn smol danger" data-act="resetAll">Alles zurücksetzen</button></div>
 <div class="sep"></div><h3>Fragenübersicht</h3><p class="small muted">Auf eine Zahl klicken, um direkt zu dieser Frage zu springen.</p><div class="gridchips">${ses.entries.map((e,i)=>{const k=entryKey(e);return `<button title="Frage ${i+1}" data-act="jump" data-i="${i}" class="${ses.grades[k]===true?'done':' '}${ses.grades[k]===false?' flag':''} ${mem.flags[e.id]?'flag':''} ${i===ses.index?'active':''}">${i+1}</button>`}).join('')}</div></section>`;
 if(mem.settings.autoplay&&lastSpoken!==key){lastSpoken=key;speak((en.form==='variant'?q.variant:q.question)+' '+q.choices.map((v,i)=>String.fromCharCode(65+i)+'. '+v).join('. '))}safeScroll();}
function selectChoice(i,yes){if(!ses||ses.complete)return;const en=current(),q=map.get(en.id),key=entryKey(en);if(!Number.isInteger(i)||i<0||i>=q.choices.length)return;if(Object.prototype.hasOwnProperty.call(ses.grades,key))return;let a=ses.picks[key]||[];if(q.kind==='multi'){if(yes&&!a.includes(i))a=[...a,i];if(!yes)a=a.filter(x=>x!==i)}else a=yes?[i]:[];ses.picks[key]=a;saveSession();document.querySelectorAll('#answers .answer').forEach((label,j)=>label.classList.toggle('checked',a.includes(j)))}
function recordGrade(id,ok){const r=mem.records[id]||{attempts:0,correct:0,wrong:0};r.attempts=(Number(r.attempts)||0)+1;r[ok?'correct':'wrong']=(Number(r[ok?'correct':'wrong'])||0)+1;r.lastCorrect=ok;r.lastAt=new Date().toISOString();mem.records[id]=r;saveMeta()}
function gradeTraining(){if(!ses||ses.mode!=='train')return;const en=current(),k=entryKey(en),a=ses.picks[k]||[];if(!a.length){notify('Bitte zuerst eine Antwort auswählen.');return}if(Object.prototype.hasOwnProperty.call(ses.grades,k))return;const ok=same(a,map.get(en.id).correct);ses.grades[k]=ok;recordGrade(en.id,ok);saveSession();showCurrent()}
function retryCurrent(){if(!ses||ses.mode!=='train')return;const en=current(),k=entryKey(en);delete ses.picks[k];delete ses.grades[k];saveSession();showCurrent();notify('Neuer Versuch: Antworte erneut und prüfe die Frage.')}
function go(n){if(!ses||ses.complete)return;ses.index=Math.min(ses.entries.length-1,Math.max(0,ses.index+n));saveSession();stopSpeak();showCurrent()}
function finishTraining(approved=false){if(!ses||ses.complete||ses.mode!=='train')return;const open=ses.entries.filter(e=>!Object.prototype.hasOwnProperty.call(ses.grades,entryKey(e))).length;if(open&&!approved){askConfirm('Noch '+open+' Frage(n) nicht geprüft. Diese zählen als nicht richtig. Training trotzdem auswerten?',()=>finishTraining(true));return}const total=ses.entries.length,graded=Object.keys(ses.grades).length,done=Object.values(ses.grades).filter(x=>x===true).length;ses.complete=true;ses.reviewMode=false;ses.result={done,graded,total,missed:total-graded};mem.history.unshift({at:new Date().toISOString(),type:'train',module:ses.scope||0,total,correct:done,pct:Math.round(done/total*100)});mem.history=mem.history.slice(0,30);saveMeta();saveSession();stopSpeak();showSummary()}
function finishExam(timed=false,approved=false){if(!ses||ses.complete||ses.mode!=='exam')return;if(!timed&&!approved){const open=ses.entries.filter(e=>!(ses.picks[entryKey(e)]||[]).length).length;askConfirm('40-Fragen-Prüfung jetzt abgeben und auswerten?'+(open?' Noch '+open+' Frage(n) ohne Antwort zählen als falsch.':''),()=>finishExam(false,true));return;}let correct=0,attempted=0;for(const en of ses.entries){const key=entryKey(en),q=map.get(en.id),a=ses.picks[key]||[],ok=a.length>0&&same(a,q.correct);ses.grades[key]=ok;if(a.length){attempted++;recordGrade(en.id,ok)}if(ok)correct++}ses.complete=true;ses.reviewMode=false;ses.result={done:correct,graded:attempted,total:ses.entries.length,missed:ses.entries.length-attempted,timed};mem.history.unshift({at:new Date().toISOString(),type:'exam',module:0,total:ses.entries.length,correct,pct:Math.round(correct/ses.entries.length*100)});mem.history=mem.history.slice(0,30);saveMeta();saveSession();stopSpeak();showSummary()}
function showSummary(){clearNotice();if(!ses?.complete){home();return}const r=ses.result,pct=Math.round(100*r.done/r.total),errors=ses.entries.filter(e=>ses.grades[entryKey(e)]===false||ses.grades[entryKey(e)]===undefined);app.innerHTML=`<section class="card"><div class="eyebrow">${ses.mode==='exam'?'Prüfungssimulation':'Lerntraining'} · Ergebnis</div><h1>${pct} % richtig</h1><p><b>${r.done} von ${r.total} Fragen richtig</b> · ${r.graded} beantwortet · ${r.missed} unbeantwortet</p><p class="note">Keine Bestehensgrenze. Du siehst nur dein Ergebnis und kannst die Fragen beliebig oft üben.</p><div class="actions"><button class="btn primary" data-act="reviewResults">${ses.reviewMode?'Auswertung ausblenden':'Alle Fragen mit Erklärungen ansehen'}</button><button class="btn" data-act="retryWrong" ${errors.length?'':'disabled'}>${errors.length} Fehler / offene Fragen erneut üben</button><button class="btn" data-act="clearSession">⌂ Zur Startseite</button><button class="btn danger" data-act="resetAll">Alles zurücksetzen</button></div></section>${ses.reviewMode?`<section class="card"><h2>Alle Antworten & Erklärungen</h2>${ses.entries.map((en,i)=>{const q=map.get(en.id),ans=ses.picks[entryKey(en)]||[],ok=ses.grades[entryKey(en)];return `<div class="review"><div class="small muted">Frage ${i+1} · Bereich ${q.module} · ${en.form==='variant'?'Anders gefragt':'Original'}</div><h4>${esc(en.form==='variant'?q.variant:q.question)}</h4><p>Deine Auswahl: <b>${ans.length?ans.map(j=>String.fromCharCode(65+j)).join(', '):'–'}</b> · Richtige Auswahl: <b>${q.correct.map(j=>String.fromCharCode(65+j)).join(', ')}</b> · <strong style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Richtig':'Falsch / offen'}</strong></p><p class="small"><b>Richtig:</b> ${q.correct.map(j=>esc(q.choices[j])).join(' · ')}</p><p class="small">${esc(q.explanation)}</p><button class="btn smol" data-act="speakReview" data-i="${i}">🔊 Erklärung vorlesen</button></div>`}).join('')}</section>`:''}`;safeScroll()}
function showErrors(){stopSpeak();clearNotice();const ids=wrongIDs();app.innerHTML=`<section class="card"><div class="eyebrow">Deine persönliche Fehlerliste</div><h1>${ids.length} Frage${ids.length===1?'':'n'} erneut üben</h1><p class="muted">Nur wirklich falsch beantwortete Fragen stehen hier. Sobald eine Frage erneut vollständig richtig beantwortet wird, verschwindet sie aus der Liste.</p><div class="actions"><button class="btn primary" data-act="startErrors" ${ids.length?'':'disabled'}>Alle Fehler trainieren</button><button class="btn" data-act="goHome">⌂ Zur Startseite</button></div></section>${ids.length?`<section class="card"><div class="listitems">${ids.map(id=>{const q=map.get(id);return `<div class="listitem"><div><b>Bereich ${q.module} · Frage ${q.number}</b><p class="small" style="margin:3px 0">${esc(q.question)}</p></div><button class="btn smol" data-act="startSingleError" data-id="${esc(id)}">Erneut üben</button></div>`}).join('')}</div></section>`:''}`;safeScroll()}
function startFailedOnly(n){const ids=wrongIDs().filter(id=>!n||map.get(id).module===n);if(!ids.length){notify('Aktuell ist keine falsch beantwortete Frage gespeichert.');return}startTraining(ids,selectedSet==='mixed'?'original':selectedSet)}
function resetModule(n){if(!n||!MODULES.some(m=>m.n===n))return;askConfirm('Ergebnisse und Fehlerliste von EduByte-Bereich '+n+' wirklich zurücksetzen?',()=>performResetModule(n))}
function performResetModule(n){const ids=new Set(BANK.filter(q=>q.module===n).map(q=>q.id));for(const id of ids){delete mem.records[id];delete mem.flags[id]}mem.history=mem.history.filter(x=>x.module!==n);if(ses&&ses.entries.some(e=>ids.has(e.id))){ses=null;saveSession()}saveMeta();home();notify('Bereich '+n+' wurde zurückgesetzt.')}
function resetAll(){askConfirm('Wirklich alle Lernergebnisse, Fehlerlisten und gespeicherten Sitzungen zurücksetzen? Die Fragen bleiben erhalten.',performResetAll)}
function performResetAll(){const s={...mem.settings};mem=defaults();mem.settings=s;ses=null;saveSession();saveMeta();home();notify('Alle Lernstände wurden zurückgesetzt. Die Fragen bleiben erhalten.')}
function saveBackup(){const data={type:'modul3-trainer-backup',version:2,created:new Date().toISOString(),records:mem.records,flags:mem.flags,settings:mem.settings,history:mem.history,session:ses};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Modul3_Lernfortschritt_Sicherung.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('Die Sicherungsdatei wurde zum Herunterladen vorbereitet.')}
function loadBackup(){if(ses&&!ses.complete){askConfirm('Eine Sicherung einzulesen ersetzt deine aktuelle Sitzung und deine Lernstände. Wirklich fortfahren?',()=>openBackupPicker());return}openBackupPicker()}
function openBackupPicker(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.style.display='none';document.body.appendChild(input);input.onchange=async()=>{try{if(!input.files.length)return;const data=JSON.parse(await input.files[0].text());if(data.type!=='modul3-trainer-backup'||!data.records||typeof data.records!=='object'||!data.flags||typeof data.flags!=='object')throw Error('Diese Datei enthält keine gültige Trainer-Sicherung.');/* Das bewusste Auswählen einer Sicherungsdatei löst direkt die Wiederherstellung aus. */const cleanRecords={};for(const [id,r] of Object.entries(data.records)){if(!map.has(id)||!r||typeof r!=='object'||Array.isArray(r))continue;const attempts=Number(r.attempts),correct=Number(r.correct),wrong=Number(r.wrong);if(![attempts,correct,wrong].every(n=>Number.isSafeInteger(n)&&n>=0)||correct+wrong>attempts)continue;cleanRecords[id]={attempts,correct,wrong,lastCorrect:typeof r.lastCorrect==='boolean'?r.lastCorrect:null,lastAt:typeof r.lastAt==='string'?r.lastAt:''};}
const cleanFlags=Object.fromEntries(Object.entries(data.flags).filter(([id,value])=>map.has(id)&&value===true));
const rawSettings=data.settings&&typeof data.settings==='object'&&!Array.isArray(data.settings)?data.settings:{};
const cleanSettings={...defaults().settings,autoplay:rawSettings.autoplay===true,speed:[0.8,1,1.15].includes(rawSettings.speed)?rawSettings.speed:1,pult:['original','variant','mixed'].includes(rawSettings.pult)?rawSettings.pult:'original'};
const cleanHistory=(Array.isArray(data.history)?data.history:[]).filter(x=>x&&['exam','train'].includes(x.type)&&Number.isFinite(x.total)&&x.total>0&&Number.isFinite(x.correct)&&x.correct>=0&&x.correct<=x.total&&Number.isFinite(x.pct)).slice(0,30);
const cleanSession=normalizeSession(data.session);
mem.records=cleanRecords;mem.flags=cleanFlags;mem.settings=cleanSettings;mem.history=cleanHistory;ses=cleanSession;selectedSet=cleanSettings.pult;saveMeta();saveSession();home();notify('Sicherung erfolgreich eingelesen.');}catch(e){notify('Sicherung konnte nicht geladen werden: '+e.message)}finally{input.remove()}};input.click()}
function speak(t){if(!('speechSynthesis' in window)){notify('Sprachausgabe ist in diesem Browser nicht verfügbar.');return}try{stopSpeak();const utter=new SpeechSynthesisUtterance(t);utter.lang='de-DE';utter.rate=Number(mem.settings.speed)||1;const voices=speechSynthesis.getVoices();const german=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));if(german)utter.voice=german;speechSynthesis.speak(utter)}catch(e){notify('Die Sprachausgabe ist momentan nicht verfügbar: '+e.message)}}
function stopSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
function handle(action,target){const n=Number(target.dataset.module||0);switch(action){
case 'confirmYes':{const f=pendingAction;cancelConfirm();if(f)f()}break;
case 'confirmNo':cancelConfirm();break;
case 'chooseSet':selectedSet=target.dataset.set;mem.settings.pult=selectedSet;saveMeta();home();break;
case 'start':startTraining(BANK.filter(q=>!n||q.module===n).map(q=>q.id));break;
case 'startErrors':startFailedOnly(0);break;
case 'showErrors':showErrors();break;
case 'startSingleError':if(map.has(target.dataset.id))startTraining([target.dataset.id],'original');break;
case 'startModuleErrors':startFailedOnly(n);break;
case 'startFlagged':startTraining(markedIDs());break;
case 'resetModule':resetModule(n);break;
case 'resetAll':resetAll();break;
case 'startExam':startExam();break;
case 'resume':showCurrent();break;
case 'discard':askConfirm('Laufende Sitzung verwerfen? Die bereits gespeicherten Lernergebnisse bleiben erhalten.',()=>{ses=null;saveSession();home()});break;
case 'prev':go(-1);break;
case 'next':go(1);break;
case 'jump':if(ses&&!ses.complete){const i=Number(target.dataset.i);if(Number.isInteger(i)&&i>=0&&i<ses.entries.length){ses.index=i;saveSession();stopSpeak();showCurrent()}}break;
case 'check':gradeTraining();break;
case 'retryCurrent':retryCurrent();break;
case 'toggleFlag':if(ses){const id=current().id;mem.flags[id]=!mem.flags[id];saveMeta();showCurrent()}break;
case 'speakQuestion':if(ses){const en=current(),q=map.get(en.id);speak((en.form==='variant'?q.variant:q.question)+'. '+q.choices.map((v,i)=>String.fromCharCode(65+i)+'. '+v).join('. '))}break;
case 'speakExplanation':if(ses)speak(map.get(current().id).explanation);break;
case 'stopSpeak':stopSpeak();break;
case 'testVoice':speak('Hallo, hier spricht dein Modul drei Lerntrainer. Du kannst dir Fragen und Erklärungen vorlesen lassen.');break;
case 'goHome':home();break;
case 'finishTraining':finishTraining();break;
case 'finishExam':finishExam();break;
case 'reviewLast':showSummary();break;
case 'reviewResults':ses.reviewMode=!ses.reviewMode;saveSession();showSummary();break;
case 'retryWrong':if(ses)startTraining([...new Set(ses.entries.filter(e=>ses.grades[entryKey(e)]!==true).map(e=>e.id))],'original');break;
case 'speakReview':if(ses){const e=ses.entries[Number(target.dataset.i)];if(e)speak(map.get(e.id).explanation)}break;
case 'clearSession':ses=null;saveSession();home();break;
case 'export':saveBackup();break;
case 'import':loadBackup();break;
default:console.warn('Unbekannte Aktion:',action)
}}
app.addEventListener('click',event=>{const target=event.target.closest('[data-act]');if(!target||target.disabled)return;event.preventDefault();safeAction(()=>handle(target.dataset.act,target))});
app.addEventListener('change',event=>{if(event.target.name==='choice')safeAction(()=>selectChoice(Number(event.target.value),event.target.checked))});
document.getElementById('topHome').onclick=()=>safeAction(home);
document.getElementById('topErrors').onclick=()=>safeAction(showErrors);
document.getElementById('topReset').onclick=()=>safeAction(resetAll);
document.getElementById('stopAudio').onclick=stopSpeak;
window.addEventListener('error',e=>{if(e.message)revealError(new Error(e.message))});
init();

</script>
